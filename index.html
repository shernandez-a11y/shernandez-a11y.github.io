<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecosistema Educativo</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--v:#7c4dff;--vd:#5a32d6;--ink:#2b1b5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);text-align:center;background:linear-gradient(180deg,#8fe3ff,#d9ecff 55%,#fff0b3);background-attachment:fixed;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:10px 12px 24px}
.top{background:#fff;border-radius:22px;padding:8px 12px;box-shadow:0 5px 0 #0002;position:sticky;top:0;z-index:3;margin-bottom:10px}
.top b{display:block;font-size:1.35rem;color:var(--v)}.top span{font-size:1.2rem;letter-spacing:1px}
.hide{display:none!important}
.map{position:relative;height:340px;border-radius:30px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 0 #0002;background:linear-gradient(180deg,#8fe3ff 0,#c9f1ff 55%,#fff6c4 100%)}
.map:before{content:'';position:absolute;left:-20%;right:-20%;bottom:-40px;height:190px;background:#7be495;border-radius:50% 50% 0 0}
.map:after{content:'';position:absolute;left:30%;right:-30%;bottom:-70px;height:170px;background:#4cd18a;border-radius:50% 50% 0 0}
.sun{position:absolute;top:8px;right:14px;font-size:2.6rem;animation:spin 14s linear infinite}
.cloud{position:absolute;font-size:2.4rem;opacity:.9;animation:drift 9s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{to{transform:translateX(26px)}}
.place{position:absolute;z-index:2;background:none;border:0;box-shadow:none;width:auto;min-height:0;padding:4px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:700;font-size:1rem;animation:bob 2.4s ease-in-out infinite}
.place .e{display:block;font-size:3.6rem;filter:drop-shadow(0 4px 2px #0003)}
.place i{display:inline-block;font-style:normal;background:#fff;border-radius:14px;padding:2px 10px;box-shadow:0 3px 0 #0002;font-size:.95rem}
.place.used{filter:grayscale(.8);opacity:.7;animation:none}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble{display:flex;gap:10px;align-items:center;background:#fff;border-radius:26px;padding:12px;margin:12px 0;text-align:left;box-shadow:0 6px 0 #0002;border:4px solid #e6dcff}
.bubble .av{font-size:3.2rem;animation:bob 2s ease-in-out infinite}.bubble p{margin:0;flex:1;font-size:1.15rem;font-weight:600}
.say{width:54px;height:54px;border-radius:50%;border:0;background:var(--v);color:#fff;font-size:1.5rem;box-shadow:0 4px 0 var(--vd);cursor:pointer;flex:none}
.back{border:0;background:#fff;color:var(--v);font:700 1.05rem inherit;font-family:inherit;border-radius:18px;padding:10px 16px;box-shadow:0 4px 0 #0002;cursor:pointer;margin:2px 0 8px}
.badge{display:inline-block;color:#fff;font-weight:700;padding:6px 16px;border-radius:20px;font-size:1.15rem;margin:4px 0}
.card{background:#fff;border-radius:28px;padding:16px;margin:12px 0;box-shadow:0 7px 0 #0002;border:4px solid #fff}
.q{font-size:1.5rem;font-weight:700;margin:6px 0 12px;line-height:1.2}
.dots{display:flex;justify-content:center;gap:10px;margin:6px 0}.d{width:20px;height:20px;border-radius:50%;background:#d8cff5}.d.on{background:#ffc933}.d.cur{background:#ff5d8f;transform:scale(1.3)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:4px solid;border-radius:24px;padding:10px 14px;font:700 1.2rem inherit;font-family:inherit;color:var(--ink);cursor:pointer;min-height:84px;box-shadow:0 5px 0 #0002;width:100%}
.opt .e{font-size:2.8rem}
.opt:nth-child(4n+1){background:#ffe3ee;border-color:#ff8fb8}.opt:nth-child(4n+2){background:#dff4ff;border-color:#7fd0ff}
.opt:nth-child(4n+3){background:#e5ffd9;border-color:#8fe06f}.opt:nth-child(4n+4){background:#fff1c2;border-color:#ffd04d}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#aaf0c1!important;border-color:#1f9d55!important;transform:scale(1.04)}
.opt.no{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:34px;font-size:1.3rem;font-weight:700;margin-top:8px}
.big{font-size:3.4rem;animation:bob 1.6s infinite}
.go{background:var(--v);color:#fff;border:0;border-radius:22px;padding:14px 22px;font:700 1.3rem inherit;font-family:inherit;box-shadow:0 5px 0 var(--vd);cursor:pointer;width:100%;margin-top:8px}
.conf{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;z-index:9;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pop{animation:pop .35s!important}@keyframes pop{50%{transform:scale(1.35) rotate(-4deg)}}
.jump{animation:jump .6s!important}@keyframes jump{30%{transform:translateY(-22px) rotate(-10deg)}60%{transform:translateY(0) rotate(8deg)}}
.pulse{animation:pulse .5s infinite alternate!important;border-color:#ffb300!important}@keyframes pulse{to{box-shadow:0 0 0 9px #ffd54f88;transform:scale(1.04)}}
.fly{position:absolute;z-index:2;background:none;border:0;box-shadow:none;font-size:2.4rem;cursor:pointer;width:auto;min-height:0;padding:2px;animation:glide 7s ease-in-out infinite alternate}
@keyframes glide{to{transform:translate(70px,-26px) rotate(8deg)}}
.tools{display:flex;justify-content:center;gap:14px}
.map{height:420px}
.place .e{font-size:5.4rem}.place i{font-size:1.15rem;font-weight:700}
.opts{grid-template-columns:1fr 1fr}
.opt{flex-direction:column;justify-content:center;text-align:center;gap:2px;min-height:190px;font-size:1.5rem;padding:10px 6px}
.opt .e{font-size:5.6rem;line-height:1.05}
.opt:last-child:nth-child(odd){grid-column:1/-1}
.qe{font-size:5rem;line-height:1.1;margin:4px 0}
.q{font-size:1.7rem}
.bubble p{font-size:1.25rem}
.say{width:64px;height:64px;font-size:1.8rem}
.big{font-size:5rem}
.rb{position:absolute;left:30%;top:0;font-size:4.6rem;opacity:.95;animation:fadein 1.2s}
.an{position:absolute;bottom:8%;z-index:1;background:none;border:0;box-shadow:none;width:auto;min-height:0;padding:0;font-size:3rem;cursor:pointer;animation:hop 1.5s ease-in-out infinite}
.an:active{transform:scale(1.4)}
.walk{animation:walk 9s ease-in-out infinite alternate}
.fl{position:absolute;bottom:2%;font-size:1.8rem;z-index:1;animation:sway 2.4s ease-in-out infinite alternate}
.tree{position:absolute;font-size:5rem;z-index:0}
.ball{position:absolute;bottom:-10%;z-index:1;background:none;border:0;box-shadow:none;width:auto;min-height:0;padding:0;font-size:2.6rem;cursor:pointer;animation:rise 9s linear infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes walk{to{transform:translateX(-90px)}}
@keyframes sway{to{transform:rotate(10deg)}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-430px)}}
@keyframes fadein{from{opacity:0;transform:scale(.6)}}
.map{animation:fadein .9s}
.place{z-index:3}
.map{height:560px}.place i{white-space:nowrap;font-size:1.05rem}@keyframes walk{to{transform:translateX(-45px)}}.an{bottom:6%}.fl{bottom:1%}

.map{height:690px;background:linear-gradient(180deg,#8fe3ff 0,#c9f1ff 45%,#e9fbff 62%)}
.map:before,.map:after{display:none}
.places{position:absolute;left:4%;right:4%;top:74px;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:4}
.places .place{position:static;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;animation:none;padding:2px}
.places .place .e{font-size:5rem;line-height:1.05}
.places .place i{margin-top:2px}
.hill{position:absolute;border-radius:50% 50% 0 0;z-index:0}
.h1{left:-35%;width:100%;bottom:105px;height:210px;background:linear-gradient(180deg,#8be07a,#5fcf6b)}
.h2{left:35%;width:100%;bottom:95px;height:175px;background:linear-gradient(180deg,#6fd36d,#43c463)}
.tree{position:absolute;font-size:4.2rem;line-height:1;z-index:1}
.an{position:absolute;bottom:150px;z-index:2;background:none;border:0;box-shadow:none;width:auto;min-height:0;padding:0;font-size:3.1rem;line-height:1;cursor:pointer;animation:walkA 6s ease-in-out infinite}
.an span{display:inline-block;animation:step .5s ease-in-out infinite}
@keyframes walkA{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(22px) scaleX(1)}50%{transform:translateX(22px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes step{50%{transform:translateY(-7px) rotate(4deg)}}
.fl{position:absolute;bottom:112px;font-size:1.7rem;z-index:1;animation:sway 2.4s ease-in-out infinite alternate}
.river{position:absolute;left:0;right:0;bottom:0;height:105px;z-index:2;background:linear-gradient(180deg,#6fd8ff,#1fa0e6);overflow:visible}
.river:before{content:'';position:absolute;top:-9px;left:0;right:0;height:20px;background:radial-gradient(circle at 10px 10px,#6fd8ff 10px,transparent 11px) 0 0/20px 20px repeat-x;animation:flow 3s linear infinite}
.river:after{content:'';position:absolute;inset:14px 0 0 0;background:repeating-linear-gradient(100deg,transparent 0 26px,#ffffff44 26px 30px,transparent 30px 56px);animation:flow2 4s linear infinite}
@keyframes flow{to{background-position-x:20px}}@keyframes flow2{to{background-position-x:56px}}
.rv{position:absolute;z-index:3;background:none;border:0;box-shadow:none;width:auto;min-height:0;padding:0;font-size:2.6rem;line-height:1;cursor:pointer}
.rv span{display:inline-block}
.swim{animation:swim 7s ease-in-out infinite alternate}.swim span{animation:step 1.2s ease-in-out infinite}
.jump span{animation:jump2 2.4s ease-in-out infinite}
.frog span{animation:step .9s ease-in-out infinite}
@keyframes swim{to{transform:translateX(70px)}}
@keyframes jump2{0%,55%,100%{transform:translateY(0) rotate(0)}75%{transform:translateY(-44px) rotate(-25deg)}}
.rb{position:absolute;top:0;font-size:4rem;line-height:1}
.fly{z-index:5;animation:glide 6s ease-in-out infinite alternate}
@keyframes glide{to{transform:translate(18px,-10px) rotate(6deg)}}
.place.used{filter:grayscale(.8);opacity:.7}
</style></head><body><main>
<div class="top"><b>🌎 Ecosistema Educativo</b><small style="display:block;font-weight:600;font-size:.95rem">Mi mundo para aprender y crecer</small><span id="stars"></span></div>

<section id="home">
 <div class="map">
  <span class="sun" style="left:82%;top:4px;right:auto">☀️</span>
  <span class="cloud" style="left:2%;top:4px">☁️</span>
  <span class="rb" style="left:34%">🌈</span>
  <button class="fly" style="left:14%;top:34px" onclick="critter('🦋','¡Mira, una mariposa!')">🦋</button>
  <button class="fly" style="left:64%;top:24px;animation-delay:1s" onclick="critter('🐦','¡Pío, pío!')">🐦</button>
  <div class="places">
   <button class="place" id="p0" onclick="sc(0)"><span class="e">🏫</span><i>Centro educativo</i></button>
   <button class="place" id="p3" onclick="sc(3)"><span class="e">🌳</span><i>Comunidad</i></button>
   <button class="place" id="p1" onclick="sc(1)"><span class="e">🧸</span><i>Aula</i></button>
   <button class="place" id="p2" onclick="sc(2)"><span class="e">🏠</span><i>Familia</i></button>
  </div>
  <div class="hill h1"></div><div class="hill h2"></div>
  <span class="tree" style="left:5%;bottom:250px">🌳</span><span class="tree" style="left:82%;bottom:232px">🌲</span>
  <button class="an" style="left:3%;animation-duration:6s" onclick="critter('🐕','¡Guau, guau!')"><span>🐕</span></button>
  <button class="an" style="left:20%;animation-duration:7s;animation-delay:-2s" onclick="critter('🐈','¡Miau, miau!')"><span>🐈</span></button>
  <button class="an" style="left:37%;animation-duration:5s;animation-delay:-1s" onclick="critter('🐇','¡Salta, conejito!')"><span>🐇</span></button>
  <button class="an" style="left:54%;animation-duration:8s;animation-delay:-3s" onclick="critter('🐑','¡Bee, bee!')"><span>🐑</span></button>
  <button class="an" style="left:71%;animation-duration:10s" onclick="critter('🐢','¡Despacito, tortuguita!')"><span>🐢</span></button>
  <span class="fl" style="left:14%">🌼</span><span class="fl" style="left:32%">🌷</span><span class="fl" style="left:50%">🌻</span><span class="fl" style="left:68%">🌸</span><span class="fl" style="left:90%">🌼</span>
  <div class="river"></div>
  <button class="rv swim" style="left:6%;bottom:42px" onclick="critter('🦆','¡Cuac, cuac!')"><span>🦆</span></button>
  <button class="rv swim" style="left:56%;bottom:20px;animation-delay:-3s" onclick="critter('🦆','¡Cuac, cuac!')"><span>🦆</span></button>
  <button class="rv jump" style="left:36%;bottom:26px" onclick="critter('🐟','¡Splash! ¡Un pececito!')"><span>🐟</span></button>
  <button class="rv jump" style="left:74%;bottom:30px;animation-delay:-1.2s" onclick="critter('🐠','¡Splash! ¡Qué lindo pez!')"><span>🐠</span></button>
  <button class="rv frog" style="left:82%;bottom:66px" onclick="critter('🐸','¡Croac, croac!')"><span>🐸</span></button>
 </div>
 <div class="bubble"><span class="av" onclick="chat(this)">🦉</span><p id="btxt"></p><button class="say" onclick="say($('btxt').textContent)">🔊</button></div>
</section>

<section id="play" class="hide">
 <button class="back" onclick="home()">🗺️ Volver</button><br>
 <span class="badge" id="badge"></span>
 <div class="bubble"><span class="av" onclick="chat(this)">🦉</span><p id="nexp"></p><button class="say" onclick="say(cur.exp)">🔊</button></div>
 <div class="card" id="q">
  <div class="dots" id="dots"></div>
  <div class="qe" id="qe"></div><div class="q" id="qtext"></div>
  <div class="tools"><button class="say" style="width:60px;height:60px" onclick="say(qs[qi].q)">🔊</button><button class="say" style="width:60px;height:60px;background:#ffb300;box-shadow:0 4px 0 #c98a00" onclick="hint()">💡</button></div>
  <div class="opts" id="opts" style="margin-top:12px"></div>
  <div class="fb" id="fb"></div>
 </div>
 <div class="card hide" id="done"><div class="big">🎉🏅🎉</div><div class="q">¡Lo lograste!</div><button class="go" onclick="home()">🗺️ Volver</button></div>
</section>

<section id="end" class="hide card">
 <div class="big">🏆🌈🏆</div><div class="q">¡Lo lograste!</div>
 <div style="font-size:1.6rem">⭐⭐⭐⭐⭐⭐⭐⭐⭐</div>
 <button class="go" onclick="say('¡Lo lograste! ¡Felicitaciones! ¡Eres genial!')">🔊 Escuchar</button>
 <button class="go" style="background:#ff5d8f;box-shadow:0 5px 0 #c93a6a" onclick="again()">🔄 Jugar otra vez</button>
</section>
</main>
<script>
const N=[
{id:1,t:'Mi centro educativo',c:'#14b8a6',exp:'¡Mi centro educativo! ¡Aquí jugamos y nos cuidamos!',
 q:[{e:'🧃',q:'¿Dónde va la basura?',o:[['🗑️','Tacho',1],['🎒','Mochila',0]]},
    {e:'🧒🧒',q:'¿Cómo saludamos?',o:[['😊','Sonrisa',1],['😠','Enojo',0]]},
    {e:'🍎',q:'¿De qué color es?',o:[['🔴','Rojo',1],['🔵','Azul',0]]}]},
{id:2,t:'Mi aula',c:'#ec4899',exp:'¡Mi aula! ¡Mi docente me ayuda a aprender!',
 q:[{e:'👩‍🏫',q:'¿Qué hacemos en el aula?',o:[['🎨','Pintar',1],['📖','Leer',1],['🚗','Manejar',0]]},
    {e:'🍎 + 🍎🍎',q:'¿Cuántas manzanas?',o:[['3️⃣','Tres',1],['2️⃣','Dos',0],['5️⃣','Cinco',0]]},
    {e:'🔔',q:'Suena la campana',o:[['🎒','Mochila',1],['🏃','Correr',0]]}]},
{id:3,t:'Mi familia y mi comunidad',c:'#f59e0b',exp:'¡Mi familia y mi comunidad me cuidan! ¡Cuando crezca, ayudaré!',
 q:[{e:'⭐',q:'¿Qué quieres ser?',o:[['🩺','Doctora',1],['🎨','Artista',1],['👩‍🏫','Docente',1],['🚒','Bombero',1]]},
    {e:'🏠',q:'¿Quién me cuida?',o:[['👨‍👩‍👧','Familia',1],['🎮','Juego',0]]},
    {e:'🌳',q:'¿Cómo cuidamos el parque?',o:[['🌷','Cuidar',1],['🗑️','Ensuciar',0]]}]}
];
const SC=[{n:1,t:'Centro educativo',m:'Centro educativo.'},{n:2,t:'Aula',m:'Aula.'},{n:3,t:'Familia',m:'Familia.'},{n:3,t:'Comunidad',m:'Comunidad.'}];
let busy=0,cur,qs,qi,stars=0,doneN={},got={};
const $=i=>document.getElementById(i),SS=window.speechSynthesis;
function pickVoice(){const vs=SS.getVoices().filter(v=>/^es/i.test(v.lang));
 const f=/sabina|helena|paulina|monica|mónica|laura|elena|dalia|salome|salomé|camila|lucia|lucía|sofia|sofía|female|mujer|google español|google es/i,m=/jorge|pablo|raul|raúl|diego|carlos|alvaro|álvaro|male|hombre/i;
 return vs.find(v=>f.test(v.name)&&!m.test(v.name))||vs.find(v=>!m.test(v.name))||vs[0]}
function say(t,q){try{if(!SS)return;if(!q)SS.cancel();const u=new SpeechSynthesisUtterance(t),v=pickVoice();if(v)u.voice=v;u.lang=v?v.lang:'es-ES';u.rate=1.05;u.pitch=1.6;SS.speak(u)}catch(e){}}
function show(id){['home','play','end'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}
function upd(){$('stars').textContent='⭐'.repeat(stars)+'☆'.repeat(9-stars)}
let AC;function tone(f,d,t,w){try{const a=AC||(AC=new(window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);const s0=a.currentTime+(w||0);g.gain.setValueAtTime(.18,s0);g.gain.exponentialRampToValueAtTime(.001,s0+d);o.start(s0);o.stop(s0+d)}catch(e){}}
const sfxOk=()=>[660,880,1175].forEach((f,i)=>tone(f,.18,'sine',i*.1)),sfxNo=()=>tone(220,.3,'triangle'),sfxGo=()=>tone(520,.12,'square'),sfxWin=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'sine',i*.12));
const CH=['¡Hola! ¡Soy Silvia!','¡Tú puedes!','¡Eres genial!','¡Toca los dibujos!'];let ci=0;
function chat(el){el.classList.remove('jump');void el.offsetWidth;el.classList.add('jump');sfxGo();say(CH[ci++%CH.length])}
function critter(e,t){sfxGo();boom(8);say(t)}
function hint(){say('¡Mira! ¡Cuál se mueve!');document.querySelectorAll('#opts .opt').forEach(b=>{if(qs[qi].o[b.dataset.k][2])b.classList.add('pulse')})}
function boom(n){n=n||22;const E=['⭐','🎈','🎉','✨','🌈','💜'];for(let i=0;i<n;i++){const x=document.createElement('span');x.className='conf';x.textContent=E[i%6];x.style.left=Math.random()*95+'%';x.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}}
function tell(t){$('btxt').textContent=t;say(t)}
function home(){try{SS&&SS.cancel()}catch(e){}
 SC.forEach((c,i)=>{const b=$('p'+i);b.classList.toggle('used',!!doneN[c.n]);b.querySelector('i').textContent=c.t+(doneN[c.n]?' ✅':'')});
 if(Object.keys(doneN).length===3){show('end');say('¡Lo lograste! ¡Felicitaciones! ¡Eres genial!');return}
 show('home');$('btxt').textContent=Object.keys(doneN).length?'¡Genial! ¡Toca otro dibujo! 👆':'¡Hola! ¡Soy Silvia! ¡Toca un dibujo! 👆'}
function sc(i){const c=SC[i];
 if(doneN[c.n]){tell('¡Ya jugaste aquí! ¡Toca otro dibujo!');return}
 if(busy)return;busy=1;const b=$('p'+i);b.classList.add('pop');sfxGo();setTimeout(()=>{busy=0;b.classList.remove('pop');openN(c.n-1,c.m+' ')},380)}
function openN(i,pre){cur=N[i];qs=cur.q;qi=0;show('play');
 const b=$('badge');b.textContent='Nodo '+cur.id+' · '+cur.t;b.style.background=cur.c;
 $('nexp').textContent=cur.exp;$('done').classList.add('hide');$('q').classList.remove('hide');ask(true);say((pre||'')+cur.exp)}
function ask(first){const q=qs[qi];$('qtext').textContent=q.q;$('qe').textContent=q.e||'';$('fb').textContent='';
 $('dots').innerHTML=qs.map((_,i)=>`<span class="d ${i<qi?'on':i==qi?'cur':''}"></span>`).join('');
 $('opts').innerHTML=q.o.map((o,k)=>k).sort(()=>Math.random()-.5).map(k=>`<button class="opt" data-k="${k}" onclick="pick(${k},this)"><span class="e">${q.o[k][0]}</span><span class="l">${q.o[k][1]}</span></button>`).join('');
 say(q.q,first)}
function pick(k,b){const o=qs[qi].o[k],key=cur.id+'-'+qi;
 if(o[2]){b.classList.add('ok');if(!got[key]){got[key]=1;stars++;upd()}
  $('fb').textContent='🌟';boom();sfxOk();say(o[1]+'. '+['¡Muy bien!','¡Genial!','¡Excelente!','¡Bravo!','¡Qué lindo!'][Math.floor(Math.random()*5)]);
  document.querySelectorAll('#opts .opt').forEach(x=>{x.disabled=true;x.classList.remove('pulse')});
  setTimeout(()=>{qi++;if(qi<qs.length)ask(false);else{doneN[cur.id]=1;$('q').classList.add('hide');$('done').classList.remove('hide');boom();sfxWin();say('¡Lo lograste! ¡Bravo! ¡Toca otro dibujo!')}},2600)}
 else{b.classList.add('no');$('fb').textContent='💛 Otra vez';sfxNo();try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}say('¡Casi! ¡Otra vez!');setTimeout(()=>b.classList.remove('no'),500)}}
function again(){stars=0;doneN={};got={};upd();home()}
upd();home();
</script></body></html>
